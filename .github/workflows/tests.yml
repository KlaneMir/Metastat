name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    # Windows: DPAPI, Task Scheduler and Edge (PDF through Playwright) are part of the program
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install -e . pytest
      - name: Run tests
        run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run connector tests (Apps Script, Node built-in test runner)
        run: node --test meta-connector/tests/connector.test.js
