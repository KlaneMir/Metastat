[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "metastat"
version = "1.0.0"
description = "Facebook and Instagram statistics with history, post images and reports"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pyyaml>=6",
  "python-dotenv>=1",
  "pillow>=10",
  "tzdata",
  "fastapi>=0.110",
  "uvicorn>=0.30",
  "jinja2>=3.1",
  "openpyxl>=3.1",
  "playwright>=1.45",
  "truststore>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6.10"]

[project.scripts]
metastat = "metastat.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
metastat = ["schema.sql", "web/templates/*.html", "web/static/*", "reports/templates/*", "fakeapi/stock/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
